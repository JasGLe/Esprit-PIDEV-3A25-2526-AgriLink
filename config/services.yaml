# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    uploads_base_dir: "%kernel.project_dir%/public/uploads"
    uploads_base_url: "/uploads"
    equipements_directory: "%env(UPLOADS_BASE_DIR)%/equipements"
    opencage_api_key: "%env(OPENCAGE_API_KEY)%"
    mapbox_token: "%env(MAPBOX_TOKEN)%"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $uploadsBaseDir: "%env(UPLOADS_BASE_DIR)%"
            string $appUrl: "%env(APP_URL)%"
            string $facebookPageId: "%env(FACEBOOK_PAGE_ID)%"
            string $facebookPageAccessToken: "%env(FACEBOOK_PAGE_ACCESS_TOKEN)%"
            string $mailtrapApiToken: "%env(MAILTRAP_API_TOKEN)%"
            string $mailtrapFromEmail: "%env(MAILTRAP_FROM_EMAIL)%"
            string $mailtrapFromName: "%env(MAILTRAP_FROM_NAME)%"
            string $adminContactEmail: "%env(ADMIN_CONTACT_EMAIL)%"
            string $openWeatherApiKey: "%env(OPENWEATHER_API_KEY)%"
            string $openWeatherBaseUrl: "%env(OPENWEATHER_BASE_URL)%"
            string $geminiApiKey: "%env(GEMINI_API_KEY)%"
            string $geminiApiKey1: "%env(GEMINI_API_KEY1)%"
            string $geminiApiBaseUrl: "%env(GEMINI_API_BASE_URL)%"
            string $geminiModel: "%env(GEMINI_MODEL)%"
            string $groqApiKey: "%env(GROQ_API_KEY)%"
            string $groqApiBaseUrl: "%env(GROQ_API_BASE_URL)%"
            string $groqModel: "%env(GROQ_MODEL)%"
            string $recaptchaSiteKey: "%env(RECAPTCHA_SITE_KEY)%"
            string $recaptchaSecretKey: "%env(RECAPTCHA_SECRET_KEY)%"
            string $pollinations_api_key: "%env(POLLINATIONS_API_KEY)%"
            string $mapboxToken: "%env(MAPBOX_TOKEN)%"
            string $apiKey: "%env(PERENUAL_API_KEY)%"
            string  $groqKey: "%env(GROQ_API_KEY)%"
    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: "../src/"
        exclude:
            - "../src/DependencyInjection/"
            - "../src/Entity/"
            - "../src/Kernel.php"

    # AvatarService — uses Pollinations.ai free API (no key needed)
    App\Service\AvatarService:
        arguments:
            $appUrl: "%env(APP_URL)%"
            $uploadsBaseUrl: "%env(UPLOADS_BASE_URL)%"

    # FileUploader service with explicit parameters
    App\Service\FileUploader:
        arguments:
            $uploadsBaseDir: "%env(UPLOADS_BASE_DIR)%"
            $uploadsBaseUrl: "%env(UPLOADS_BASE_URL)%"

    # OAuthService with credentials from environment
    App\Service\OAuthService:
        arguments:
            $googleClientId: "%env(GOOGLE_CLIENT_ID)%"
            $googleClientSecret: "%env(GOOGLE_CLIENT_SECRET)%"
            $googleRedirectUri: "%env(GOOGLE_REDIRECT_URI)%"
            $facebookAppId: "%env(FACEBOOK_APP_ID)%"
            $facebookAppSecret: "%env(FACEBOOK_APP_SECRET)%"
            $facebookRedirectUri: "%env(FACEBOOK_REDIRECT_URI)%"

    App\Service\RecapitulatifMailService:
        arguments:
            $mailerFrom: "%env(MAILER_FROM_EMAIL)%"
            $appName: "AgriLink"

    App\Service\LibreTranslateService:
        arguments:
            $libreTranslateBaseUrl: "%env(LIBRETRANSLATE_BASE_URL)%"
            $libreTranslateApiKey: "%env(LIBRETRANSLATE_API_KEY)%"

    App\Service\OneSignalPushService:
        arguments:
            $oneSignalAppId: "%env(ONESIGNAL_APP_ID)%"
            $oneSignalApiKey: "%env(ONESIGNAL_API_KEY)%"
            $oneSignalEnabled: "%env(bool:ONESIGNAL_ENABLED)%"

    App\Service\MarketplaceProductRecommendationService:
        arguments:
            $projectDir: "%kernel.project_dir%"

    # Login event listeners
    App\EventListener\LoginSuccessListener:
        tags:
            - {
                  name: kernel.event_listener,
                  event: Symfony\Component\Security\Http\Event\LoginSuccessEvent,
              }

    App\EventListener\LoginFailureListener:
        tags:
            - {
                  name: kernel.event_listener,
                  event: Symfony\Component\Security\Http\Event\LoginFailureEvent,
              }

    # GroqDiagnosticService — diagnostic IA équipements
    App\Service\Equipment\GroqDiagnosticService:
        arguments:
            $groqApiKey: "%env(GROQ_API_KEY)%"
            $groqModel: "%env(GROQ_MODEL)%"

    # GeminiActivityService — AI recommendations for activities
    App\Service\Activity\GeminiActivityService:
        arguments:
            $geminiApiKey1: "%env(GEMINI_API_KEY)%"

    # GeminiVisionService — analyse visuelle photo équipements (via Groq LLaMA 4 Scout)
    App\Service\Equipment\GeminiVisionService:
        arguments:
            $groqApiKey: "%env(GROQ_API_KEY)%"

    # AssistantIAController — chatbot AgriBot équipements & maintenances
    App\Controller\Equipment\AssistantIAController:
        arguments:
            $groqApiKey: "%env(GROQ_API_KEY)%"
        tags: ["controller.service_arguments"]

    # ExchangeRateService — conversion de devises TND → USD/EUR/AED/SAR/GBP/KWD
    App\Service\Equipment\ExchangeRateService:
        arguments:
            $exchangeRateApiKey: "%env(EXCHANGERATE_API_KEY)%"

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
