twig:
    file_name_pattern: '*.twig'

    globals:
        uploads_base_url: '%env(UPLOADS_BASE_URL)%'
        onesignal_enabled: '%env(bool:ONESIGNAL_ENABLED)%'
        onesignal_app_id: '%env(ONESIGNAL_APP_ID)%'

    form_themes:
        - 'form_theme_custom.html.twig'

    default_path: '%kernel.project_dir%/templates'

when@test:
    twig:
        strict_variables: true