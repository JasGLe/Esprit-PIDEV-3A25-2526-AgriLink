<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriLink</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,700;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a1f0f;
    --card: #0f2a15;
    --card2: #122b18;
    --green: #5ec97c;
    --green-dark: #3a9e58;
    --gold: #d4a853;
    --text: #eef4ef;
    --muted: rgba(238,244,239,0.45);
    --border: rgba(94,201,124,0.18);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(94,201,124,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(58,158,88,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    padding: 32px 20px 60px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    animation: fadeDown 0.6s ease both;
  }

  .logo-wrap {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(94,201,124,0.3);
  }

  .logo-wrap img {
    width: 32px;
    height: 32px;
    object-fit: contain;
  }

  .logo-wrap .logo-fallback {
    font-size: 22px;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  .brand-name {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
    color: var(--text);
  }

  .brand-name span {
    color: var(--green);
  }

  .brand-sub {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    animation: fadeUp 0.5s ease 0.15s both;
  }

  /* Type badge bar */
  .card-bar {
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(94,201,124,0.07);
    border-bottom: 1px solid var(--border);
  }

  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(94,201,124,0.15);
    border: 1px solid rgba(94,201,124,0.3);
    color: var(--green);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 30px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease infinite;
  }

  .card-body {
    padding: 28px 28px 24px;
  }

  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 1.9rem;
    font-weight: 600;
    line-height: 1.15;
    margin-bottom: 28px;
    color: var(--text);
  }

  .card-title em {
    font-style: italic;
    color: var(--green);
  }

  /* Info grid */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }

  .info-item {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .info-item.full {
    grid-column: 1 / -1;
  }

  .info-icon {
    font-size: 18px;
    margin-bottom: 2px;
  }

  .info-label {
    font-size: 10px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .info-val {
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.4;
  }

  /* Statut chip */
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
    background: rgba(94,201,124,0.15);
    color: var(--green);
    border: 1px solid rgba(94,201,124,0.3);
  }

  /* Description box */
  .desc-box {
    background: var(--card2);
    border-left: 3px solid var(--green);
    border-radius: 0 12px 12px 0;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.7;
    color: rgba(238,244,239,0.8);
    margin-bottom: 8px;
  }

  /* ── ACTIONS ── */
  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding: 0 28px 28px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); opacity: 0.85; }

  .btn-primary {
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    color: #071509;
    box-shadow: 0 4px 18px rgba(94,201,124,0.35);
  }

  .btn-primary:hover { box-shadow: 0 8px 24px rgba(94,201,124,0.45); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-ghost:hover {
    background: rgba(94,201,124,0.07);
    border-color: rgba(94,201,124,0.4);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 30px;
    text-align: center;
    gap: 12px;
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 8px;
    opacity: 0.6;
  }

  .empty-title {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    color: var(--muted);
  }

  .empty-sub {
    font-size: 14px;
    color: var(--muted);
    opacity: 0.7;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    opacity: 0.5;
    animation: fadeUp 0.5s ease 0.35s both;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.8); }
  }

  @media (max-width: 480px) {
    .info-grid { grid-template-columns: 1fr; }
    .card-title { font-size: 1.5rem; }
    .actions { padding: 0 20px 20px; }
    .card-body { padding: 22px 20px 18px; }
    .card-bar { padding: 12px 20px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <header>
    <div class="logo-wrap" id="logoWrap">
      <img src="logo.png" alt="AgriLink Logo" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'">
      <span class="logo-fallback" id="logoFallback" style="display:none">🌿</span>
    </div>
    <div class="brand">
      <div class="brand-name">Agri<span>Link</span></div>
      <div class="brand-sub">Agriculture Connectée</div>
    </div>
  </header>

  <!-- CARD -->
  <div class="card" id="card">
    <div class="empty-state">
      <div class="empty-icon">🌾</div>
      <div class="empty-title">Aucune donnée trouvée</div>
      <div class="empty-sub">Scannez un QR code AgriLink valide pour afficher les informations.</div>
    </div>
  </div>

  <footer>AgriLink © 2025 · Agriculture Connectée</footer>
</div>

<script>
const p = new URLSearchParams(window.location.search);
const card = document.getElementById('card');

function getParam(name) {
  const value = p.get(name);
  if (!value) return '';
  try { return decodeURIComponent(decodeURIComponent(value.replace(/\+/g, ' '))); }
  catch (e) { return decodeURIComponent(value.replace(/\+/g, ' ')); }
}

function infoItem(icon, label, value, full = false) {
  if (!value) return '';
  return `
    <div class="info-item${full ? ' full' : ''}">
      <span class="info-icon">${icon}</span>
      <span class="info-label">${label}</span>
      <span class="info-val">${value}</span>
    </div>`;
}

const isActivity = p.has('type_act') || p.has('debut');

if (isActivity) {
  const titre   = getParam('titre');
  const typeAct = getParam('type_act');
  const debut   = getParam('debut');
  const fin     = getParam('fin');
  const statut  = getParam('statut');
  const cout    = getParam('cout');

  document.title = "AgriLink — Activité";

  card.innerHTML = `
    <div class="card-bar">
      <div class="type-badge"><span class="dot"></span>Activité Agricole</div>
      ${typeAct ? `<span style="color:var(--muted);font-size:13px">${typeAct}</span>` : ''}
    </div>
    <div class="card-body">
      <div class="card-title">${titre || '<em>Activité Agricole</em>'}</div>
      <div class="info-grid">
        ${infoItem('📅', 'Début', debut)}
        ${infoItem('🏁', 'Fin', fin)}
        ${cout ? infoItem('💰', 'Coût estimé', cout) : ''}
        ${statut ? `<div class="info-item${!cout ? ' full' : ''}">
          <span class="info-icon">📊</span>
          <span class="info-label">Statut</span>
          <div class="status-chip"><span class="dot"></span>${statut}</div>
        </div>` : ''}
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="shareIt()">⬆ Partager</button>
    </div>`;

} else {

  const titre = getParam('titre');
  const date  = getParam('date');
  const heure = getParam('heure');
  const lieu  = getParam('lieu');
  const type  = getParam('type');
  const desc  = getParam('desc');

  if (titre || date || lieu) {
    document.title = titre ? "AgriLink — " + titre : "AgriLink — Événement";

    card.innerHTML = `
      <div class="card-bar">
        <div class="type-badge"><span class="dot"></span>Événement</div>
        ${type ? `<span style="color:var(--muted);font-size:13px">${type}</span>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${titre || '<em>Événement Agricole</em>'}</div>
        <div class="info-grid">
          ${date ? infoItem('📅', 'Date', date + (heure ? ' à ' + heure : '')) : ''}
          ${lieu ? infoItem('📍', 'Lieu', lieu) : ''}
          ${desc ? `<div class="info-item full">
            <span class="info-icon">📝</span>
            <span class="info-label">Description</span>
            <div class="desc-box">${desc}</div>
          </div>` : ''}
        </div>
      </div>
      <div class="actions">
        ${date && heure ? `<button class="btn btn-primary" onclick="addToCalendar('${escAttr(date)}','${escAttr(heure)}','${escAttr(titre)}','${escAttr(lieu)}','${escAttr(desc)}')">📆 Ajouter au calendrier</button>` : ''}
        <button class="btn btn-ghost" onclick="shareIt()">⬆ Partager</button>
      </div>`;
  }
}

function escAttr(s) {
  return (s || '').replace(/'/g, "\\'");
}

function shareIt() {
  if (navigator.share) {
    navigator.share({ title: document.title, url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => alert("🔗 Lien copié !"));
  }
}

function addToCalendar(date, heure, titre, lieu, desc) {
  if (!date || !heure) return;
  const parts = date.split('/');
  if (parts.length !== 3) return;
  const start = new Date(parts[2] + '-' + parts[1] + '-' + parts[0] + 'T' + heure + ':00');
  const end   = new Date(start.getTime() + 2 * 60 * 60 * 1000);
  const fmt   = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${fmt(start)}\nDTEND:${fmt(end)}\nSUMMARY:${titre}\nLOCATION:${lieu}\nDESCRIPTION:${desc}\nEND:VEVENT\nEND:VCALENDAR`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = 'event.ics';
  a.click();
}
</script>
</body>
</html>
