[build]
builder = "nixpacks"

[deploy]
startCommand = "php bin/console doctrine:migrations:migrate --no-interaction && php -S 0.0.0.0:${PORT:-8000} -t public"
restartPolicyMaxRetries = 5

# Persistent storage for file uploads
[[services.web.volumes]]
mountPath = "/data/uploads"

[env]
APP_ENV = "production"
PHP_VERSION = "8.2"
COMPOSER_ALLOW_SUPERUSER = "1"
